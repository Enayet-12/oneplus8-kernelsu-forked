name: Build LOS24 Kernel with SukiSU-Ultra + SUSFS (Non-GKI)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_SOURCE: https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
  KERNEL_BRANCH: lineage-24.0
  KSU_BRANCH: builtin
  KPM_PATCH_VERSION: 0.13.9

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget bc bison build-essential flex \
            libssl-dev libelf-dev python3 cpio zip lz4 perl rsync

      - name: Set up Clang
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang"
          curl -fL --retry 3 \
            "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz" \
            -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/toolchains/clang"
          echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> "$GITHUB_PATH"

      - name: Set up GCC cross-compilers
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc64"
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc32"
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"

      - name: Clone LineageOS 24 kernel
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          git -C kernel log -1 --oneline

      - name: Integrate SukiSU-Ultra builtin (includes SUSFS support)
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          curl -fLSs --retry 3 \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
            -o /tmp/sukisu-setup.sh
          bash /tmp/sukisu-setup.sh "$KSU_BRANCH"
          test -d KernelSU/kernel
          test -e drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Integrate SUSFS kernel-side patches for Linux 4.19
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          git clone --depth=1 --branch kernel-4.19 \
            https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs4ksu"
          SUSFS="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
          test -s "$SUSFS/50_add_susfs_in_kernel-4.19.patch"
          test -s "$SUSFS/fs/susfs.c"
          test -s "$SUSFS/include/linux/susfs.h"
          test -s "$SUSFS/include/linux/susfs_def.h"
          install -m 0644 "$SUSFS/fs/susfs.c" fs/susfs.c
          install -m 0644 "$SUSFS/include/linux/susfs.h" include/linux/susfs.h
          install -m 0644 "$SUSFS/include/linux/susfs_def.h" include/linux/susfs_def.h

          DIAG="$GITHUB_WORKSPACE/susfs-diagnostics"
          mkdir -p "$DIAG/original" "$DIAG/after-patch"
          cp "$SUSFS/50_add_susfs_in_kernel-4.19.patch" "$DIAG/"
          for file in fs/namespace.c fs/proc/task_mmu.c include/linux/mount.h fs/Makefile; do
            mkdir -p "$DIAG/original/$(dirname "$file")"
            cp "$file" "$DIAG/original/$file"
          done

          # Apply the upstream patch's compatible hunks. This LineageOS branch has
          # fs_context backports, so the rejected mount hunks are adapted below.
          set +e
          patch --batch --forward --reject-file="$DIAG/failed-hunks.rej" -p1 \
            < "$SUSFS/50_add_susfs_in_kernel-4.19.patch" > "$DIAG/patch-output.log" 2>&1
          PATCH_STATUS=$?
          set -e
          cat "$DIAG/patch-output.log"
          if [ "$PATCH_STATUS" -ne 0 ]; then
            grep -q '4 out of 16 hunks FAILED' "$DIAG/patch-output.log"
            grep -q '1 out of 3 hunks FAILED' "$DIAG/patch-output.log"
            grep -q '1 out of 1 hunk FAILED' "$DIAG/patch-output.log"
            FAIL_COUNT=$(grep -c 'Hunk #[0-9].*FAILED' "$DIAG/patch-output.log" || true)
            if [ "$FAIL_COUNT" -ne 6 ]; then
              echo "Unexpected SUSFS patch failure count: $FAIL_COUNT (expected 6)" >&2
              exit 1
            fi
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # The include hunk's context differs because this branch includes fs_context.h.
          replace_once(
              "fs/namespace.c",
              "#include <linux/fs_context.h>\n",
              "#include <linux/fs_context.h>\n"
              "#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n",
          )
          replace_once(
              "fs/namespace.c",
              '#include "internal.h"\n',
              '''#include "internal.h"

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern bool susfs_is_current_zygote_domain(void);

          static DEFINE_IDA(susfs_mnt_id_ida);
          static DEFINE_IDA(susfs_mnt_group_ida);

          #define CL_ZYGOTE_COPY_MNT_NS BIT(24) /* used by copy_mnt_ns() */
          #define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */
          #endif

          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          extern void susfs_auto_add_sus_ksu_default_mount(const char __user *to_pathname);
          bool susfs_is_auto_add_sus_ksu_default_mount_enabled = true;
          #endif
          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          extern int susfs_auto_add_sus_bind_mount(const char *pathname, struct path *path_target);
          bool susfs_is_auto_add_sus_bind_mount_enabled = true;
          #endif
          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          extern void susfs_auto_add_try_umount_for_bind_mount(struct path *path);
          bool susfs_is_auto_add_try_umount_for_bind_mount_enabled = true;
          #endif
          '''.replace("\n          ", "\n"),
          )

          replace_once(
              "fs/namespace.c",
              "\tmnt = alloc_vfsmnt(fc->source ?: \"none\");\n"
              "\tif (!mnt)\n"
              "\t\treturn ERR_PTR(-ENOMEM);",
              '''#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tif (unlikely(susfs_is_current_ksu_domain()))
          \t\tmnt = alloc_vfsmnt(fc->source ?: "none", true, 0);
          \telse
          \t\tmnt = alloc_vfsmnt(fc->source ?: "none", false, 0);
          #else
          \tmnt = alloc_vfsmnt(fc->source ?: "none");
          #endif
          \tif (!mnt)
          \t\treturn ERR_PTR(-ENOMEM);'''.replace("\n          ", "\n"),
          )
          replace_once(
              "fs/namespace.c",
              "\tmnt->mnt_parent\t\t= mnt;\n\n"
              "\tlock_mount_hash();\n"
              "\tlist_add_tail(&mnt->mnt_instance, &mnt->mnt.mnt_sb->s_mounts);",
              '''\tmnt->mnt_parent\t\t= mnt;

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \t// For zygote-created mounts, reorder the visible mount ID.
          \tif (susfs_is_current_zygote_domain()) {
          \t\tmnt->mnt.susfs_mnt_id_backup = mnt->mnt_id;
          \t\tmnt->mnt_id = current->susfs_last_fake_mnt_id++;
          \t}
          #endif

          \tlock_mount_hash();
          \tlist_add_tail(&mnt->mnt_instance, &mnt->mnt.mnt_sb->s_mounts);'''.replace("\n          ", "\n"),
          )

          replace_once(
              "fs/namespace.c",
              "\tstruct mount *mnt;\n\tint err;\n\n\tmnt = alloc_vfsmnt(old->mnt_devname);",
              '''\tstruct mount *mnt;
          \tint err;

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tbool is_current_ksu_domain = susfs_is_current_ksu_domain();
          \tbool is_current_zygote_domain = susfs_is_current_zygote_domain();
          #endif

          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \t/* Distinguish a single clone from a mount-namespace copy. */
          \tif (unlikely(is_current_ksu_domain)) {
          \t\tif (!(flag & CL_COPY_MNT_NS)) {
          \t\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);
          \t\t\tgoto bypass_orig_flow;
          \t\t}
          \t\tmnt = alloc_vfsmnt(old->mnt_devname, true, old->mnt_id);
          \t\tif (mnt)
          \t\t\tmnt->mnt.susfs_mnt_id_backup = DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE;
          \t\tgoto bypass_orig_flow;
          \t}
          \tif (likely(is_current_zygote_domain) && (old->mnt_id >= DEFAULT_SUS_MNT_ID)) {
          \t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);
          \t\tgoto bypass_orig_flow;
          \t}
          \tif ((flag & CL_COPY_MNT_NS) && (old->mnt_id >= DEFAULT_SUS_MNT_ID)) {
          \t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);
          \t\tgoto bypass_orig_flow;
          \t}
          \tmnt = alloc_vfsmnt(old->mnt_devname, false, 0);
          bypass_orig_flow:
          #else
          \tmnt = alloc_vfsmnt(old->mnt_devname);
          #endif'''.replace("\n          ", "\n"),
          )

          # The upstream vfs_kern_mount hunk can match clone_mnt's similar block by fuzz.
          wrong = '''#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \t// If caller process is zygote, then it is a normal mount, so we just reorder the mnt_id
          \tif (susfs_is_current_zygote_domain()) {
          \t\tmnt->mnt.susfs_mnt_id_backup = mnt->mnt_id;
          \t\tmnt->mnt_id = current->susfs_last_fake_mnt_id++;
          \t}
          #endif'''.replace("\n          ", "\n")
          correct = '''#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \t// If caller is zygote and this is not a namespace copy, reorder the mount ID.
          \tif (likely(is_current_zygote_domain) && !(flag & CL_ZYGOTE_COPY_MNT_NS)) {
          \t\tmnt->mnt.susfs_mnt_id_backup = mnt->mnt_id;
          \t\tmnt->mnt_id = current->susfs_last_fake_mnt_id++;
          \t}
          #endif'''.replace("\n          ", "\n")
          p = Path("fs/namespace.c")
          text = p.read_text()
          if text.count(wrong) != 1:
              raise SystemExit(f"Expected one misapplied zygote hunk in clone_mnt(), found {text.count(wrong)}")
          p.write_text(text.replace(wrong, correct, 1))

          replace_once(
              "fs/proc/task_mmu.c",
              "#include <linux/ctype.h>\n",
              "#include <linux/ctype.h>\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n",
          )
          replace_once(
              "include/linux/mount.h",
              "\tANDROID_KABI_RESERVE(4);\n",
              '''#ifdef CONFIG_KSU_SUSFS
          \tANDROID_KABI_USE(4, u64 susfs_mnt_id_backup);
          #else
          \tANDROID_KABI_RESERVE(4);
          #endif
          #if defined(CONFIG_KSU_SUSFS) && !defined(ANDROID_KABI_RESERVE)
          \tu64 susfs_mnt_id_backup;
          #endif
          '''.replace("\n          ", "\n"),
          )
          PY

          grep -q 'susfs_is_current_ksu_domain' fs/namespace.c
          grep -q 'CL_COPY_MNT_NS' fs/namespace.c
          grep -q 'ANDROID_KABI_USE(4, u64 susfs_mnt_id_backup)' include/linux/mount.h
          grep -q 'susfs_def.h' fs/proc/task_mmu.c
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

          for file in fs/namespace.c fs/proc/task_mmu.c include/linux/mount.h fs/Makefile; do
            mkdir -p "$DIAG/after-patch/$(dirname "$file")"
            cp "$file" "$DIAG/after-patch/$file"
          done
          git diff -- fs/namespace.c fs/proc/task_mmu.c include/linux/mount.h fs/Makefile \
            > "$DIAG/partial-kernel-diff.patch" || true

      - name: Upload SUSFS patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-patch-diagnostics-${{ github.run_number }}
          path: ${{ github.workspace }}/susfs-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Fix MSM driver strnstr API call
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path("drivers/gpu/drm/msm/msm_drv.c")
          source = path.read_text()
          old = 'strnstr(dev_name(dev), "mdp")'
          new = 'strnstr(dev_name(dev), "mdp", strlen(dev_name(dev)))'
          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one old two-argument strnstr call in {path}, found {count}; refusing an uncertain edit."
              )
          path.write_text(source.replace(old, new, 1))
          if new not in path.read_text():
              raise SystemExit("strnstr compatibility edit did not persist")
          print(f"Updated {path}: supplied the required size_t bound to strnstr().")
          PYCODE

      - name: Configure kernel
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          mkdir -p out
          if [ -f "$GITHUB_WORKSPACE/device_config" ]; then
            cp "$GITHUB_WORKSPACE/device_config" out/.config
            echo 'Using repository-provided device_config'
          else
            DEFCONFIG=''
            for candidate in \
              vendor/sm8250-perf_defconfig \
              vendor/instantnoodlep_defconfig \
              vendor/sm8250_defconfig \
              instantnoodlep_defconfig; do
              if [ -f "arch/arm64/configs/$candidate" ]; then
                DEFCONFIG="$candidate"
                break
              fi
            done
            if [ -z "$DEFCONFIG" ]; then
              echo 'ERROR: No known OnePlus 8 Pro/SM8250 defconfig was found.' >&2
              find arch/arm64/configs -type f -name '*defconfig' | sort | grep -Ei 'sm8250|instantnoodlep|kona' || true
              exit 1
            fi
            echo "Using defconfig: $DEFCONFIG"
            make O=out ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              CLANG_TRIPLE=aarch64-linux-gnu- CC=clang \
              "$DEFCONFIG"
          fi
          # Always normalize the config before setting options; this prevents the
          # interactive Kconfig restart prompts shown in the supplied failed log.
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- CC=clang olddefconfig

          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KALLSYMS
          scripts/config --file out/.config -e KALLSYMS_ALL
          scripts/config --file out/.config -e KPM
          scripts/config --file out/.config -e KSU_SUSFS
          scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH
          scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
          scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
          scripts/config --file out/.config -e KSU_SUSFS_SPOOF_UNAME
          scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG
          scripts/config --file out/.config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --file out/.config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --file out/.config -e KSU_SUSFS_OPEN_REDIRECT
          scripts/config --file out/.config -e KSU_SUSFS_SUS_MAP
          # This old Android 4.19 tree's BPF UMD helper is not generated correctly
          # (bpf_preload_umd_blob.S fails its .incbin). Keep core BPF enabled, but
          # disable only the optional userspace preload helper that triggers the failure.
          scripts/config --file out/.config -d BPF_PRELOAD_UMD
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- CC=clang olddefconfig
          grep -E 'CONFIG_KSU=|CONFIG_KPM=|CONFIG_KSU_SUSFS' out/.config || true
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KPM=y' out/.config
          grep -q '^CONFIG_KALLSYMS=y' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config
          if grep -Eq '^CONFIG_BPF_PRELOAD_UMD=[ym]' out/.config; then
            echo 'ERROR: optional BPF UMD preload helper is still enabled' >&2
            exit 1
          fi
          # Confirm the kernel-side SUSFS source and Makefile integration exist.
          test -s fs/susfs.c
          grep -q 'susfs' fs/Makefile

      - name: Build kernel
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          make -j"$(nproc --all)" O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          test -s out/arch/arm64/boot/Image

      - name: Apply KPM patch
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot"
          curl -fL --retry 3 \
            "https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/${KPM_PATCH_VERSION}/patch_linux" \
            -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          if [ -s oImage ]; then
            mv -f oImage Image
          else
            echo 'KPM patch did not produce oImage; refusing to publish an unpatched kernel.' >&2
            exit 1
          fi
          rm -f patch_linux

      - name: Package AnyKernel3 flashable ZIP
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git modules patch ramdisk
          cp ../out/arch/arm64/boot/Image ./Image

          # Configure the installer for OnePlus 8 Pro. Fail if expected fields are absent.
          grep -q '^do.devicecheck=' anykernel.sh
          grep -q '^device.name1=' anykernel.sh
          grep -q '^block=' anykernel.sh
          grep -q '^is_slot_device=' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=instantnoodlep/' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=1;/' anykernel.sh

          ZIP_NAME="SukiSU-Ultra-SUSFS_OnePlus8Pro_LOS24_$(date -u +%Y%m%d).zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.git/*' 'README.md' '*placeholder*'
          test -s "$GITHUB_WORKSPACE/$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sukisu-susfs-los24-${{ github.run_number }}
          name: SukiSU-Ultra + SUSFS LOS24 Build ${{ github.run_number }}
          body: |
            Automated OnePlus 8 Pro kernel build for the LineageOS 24.0 branch.

            Includes SukiSU-Ultra builtin, its integrated SUSFS options, and KPM.

            Install the AnyKernel3 ZIP from custom recovery only after confirming the device and ROM compatibility. Keep a known-good boot image available before flashing.
          files: ${{ github.workspace }}/${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
